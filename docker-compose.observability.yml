# Optional observability stack for AuraHR — self-hosted, free, no external
# accounts required. Combine with the main prod stack:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Every service here is intentionally bound to 127.0.0.1 only (not proxied
# through the public nginx, not published to the internet) — reach them via
# an SSH tunnel, e.g.:
#
#   ssh -L 3000:localhost:3000 -L 8080:localhost:8080 -L 3001:localhost:3001 you@your-vps
#
# then open http://localhost:3000 (Grafana), http://localhost:8080
# (GlitchTip), http://localhost:3001 (Uptime Kuma) on your own machine.
# See observability/README.md for first-run setup of each service.
#
# Resource note: this whole stack (GlitchTip's web+worker + Prometheus +
# Grafana + Loki + Promtail + Uptime Kuma) wants at least ~2 extra GB of RAM
# on top of the main app stack. On a small VPS, consider a hosted Sentry free
# tier instead of self-hosting GlitchTip if memory is tight.

services:
  # --- Error tracking (Sentry-protocol compatible) ---
  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.2.9
    command: ./manage.py migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@db:5432/glitchtip
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY must be set in .env.production, generate one with openssl rand -hex 32}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip:v4.2.9
    container_name: aurawork_glitchtip
    restart: always
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@db:5432/glitchtip
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY must be set in .env.production}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8080}
      - DEFAULT_FROM_EMAIL=${SMTP_FROM:-noreply@example.com}
      - ENABLE_OPEN_USER_REGISTRATION=false
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.2.9
    container_name: aurawork_glitchtip_worker
    restart: always
    command: ./bin/run-celery-with-beat.sh
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@db:5432/glitchtip
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY must be set in .env.production}
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  # --- Metrics ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aurawork_prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: aurawork_grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.production}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  # --- Log aggregation ---
  loki:
    image: grafana/loki:3.3.0
    container_name: aurawork_loki
    restart: always
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.3.0
    container_name: aurawork_promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  # --- Uptime + alerting ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: aurawork_uptime_kuma
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
