version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aurawork_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.production}
    # No host port mapping: only reachable by other services on the internal
    # Docker network, never directly from the host/internet.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurawork_redis
    restart: always
    # No host port mapping: internal network only, same as db.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: aurawork_backend
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env.production}
      - REDIS_URL=redis://redis:6379/0
    # No host port mapping: only the nginx proxy talks to this service.
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: aurawork_frontend
    restart: always
    env_file:
      - ./frontend/.env.production
    environment:
      - BACKEND_URL=http://backend:8000
    # No host port mapping: only the nginx proxy talks to this service.
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    container_name: aurawork_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  # Not run continuously — invoked on-demand (initial issuance manually,
  # renewal via cron) by nginx/scripts/renew_certs.sh. See nginx/certs/README.md.
  certbot:
    image: certbot/certbot:latest
    container_name: aurawork_certbot
    volumes:
      - ./nginx/certbot-letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
