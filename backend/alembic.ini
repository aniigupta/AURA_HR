# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, space-separated, directories placed here will be added to sys.path.
prepend_sys_path = .

# database url is loaded dynamically in env.py
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/attendance_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
